<!-- ================= REGISTER SECTION ================= -->


<section class="auth-section">


<div class="container">


<div class="row justify-content-center">


<div class="col-lg-6">


<div class="auth-card shadow">



<div class="text-center mb-4">


<div class="auth-icon">

<i class="bi bi-person-plus-fill"></i>

</div>



<h2 class="fw-bold">

Create Account

</h2>



<p class="text-muted">

Join Quizeers and start learning

</p>


</div>






<form id="registerForm">





<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label">

First Name

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-person"></i>

</span>



<input

type="text"

class="form-control"

id="firstName"

placeholder="First name"

required>


</div>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

Last Name

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-person"></i>

</span>



<input

type="text"

class="form-control"

id="lastName"

placeholder="Last name"

required>


</div>


</div>


</div>








<div class="mb-3">


<label class="form-label">

Email Address

</label>



<div class="input-group">


<span class="input-group-text">

<i class="bi bi-envelope"></i>

</span>



<input

type="email"

class="form-control"

id="registerEmail"

placeholder="example@email.com"

required>



</div>


</div>








<div class="mb-3">


<label class="form-label">

Username

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-person-badge"></i>

</span>



<input

type="text"

class="form-control"

id="username"

placeholder="Choose username"

required>



</div>


</div>








<div class="mb-3">


<label class="form-label">

Password

</label>



<div class="input-group">


<span class="input-group-text">

<i class="bi bi-lock"></i>

</span>



<input

type="password"

class="form-control"

id="registerPassword"

placeholder="Create password"

required>



<button

type="button"

class="btn btn-outline-secondary"

id="showRegisterPassword">


<i class="bi bi-eye"></i>


</button>



</div>


</div>









<div class="mb-3">


<label class="form-label">

Confirm Password

</label>


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-shield-check"></i>

</span>



<input

type="password"

class="form-control"

id="confirmPassword"

placeholder="Repeat password"

required>


</div>


</div>









<div class="mb-3">


<label class="form-label">

Country

</label>


<select class="form-select" id="country">


<option>

South Africa

</option>


<option>

Botswana

</option>


<option>

Zimbabwe

</option>


<option>

Other

</option>


</select>


</div>









<div class="form-check mb-4">


<input

class="form-check-input"

type="checkbox"

id="terms"

required>



<label class="form-check-label">

I agree to the Terms and Conditions

</label>


</div>









<button

type="submit"

class="btn btn-primary btn-lg w-100">


<i class="bi bi-person-check"></i>

Create Account


</button>





</form>







<div class="text-center mt-4">


<p>

Already have an account?


<a href="login.html">

Login here

</a>


</p>


</div>





</div>


</div>


</div>


</div>


</section>
