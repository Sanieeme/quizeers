<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Add Quiz | Admin | QuizVerse</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin.css">


</head>




<body>


<!-- NAVBAR -->


<nav class="navbar navbar-dark bg-dark">


<div class="container">


<a class="navbar-brand fw-bold"
href="admin.html">


<i class="bi bi-shield-lock-fill"></i>

Admin Panel


</a>



<a href="admin.html"
class="btn btn-outline-light">


Dashboard

</a>



</div>


</nav>









<!-- CONTENT -->


<section class="admin-section">


<div class="container">





<div class="row justify-content-center">


<div class="col-lg-8">



<div class="management-card shadow">





<div class="text-center mb-4">


<i class="bi bi-plus-circle-fill"></i>


<h1 class="fw-bold">

Create New Quiz

</h1>


<p class="text-muted">

Add a new learning challenge

</p>


</div>









<form id="addQuizForm">






<!-- TITLE -->


<div class="mb-3">


<label class="form-label">

Quiz Title

</label>


<input

type="text"

class="form-control"

id="title"

placeholder="Example: Java OOP Fundamentals"

required>


</div>








<!-- DESCRIPTION -->


<div class="mb-3">


<label class="form-label">

Description

</label>



<textarea

class="form-control"

rows="4"

id="description"

placeholder="Describe this quiz..."

required>


</textarea>


</div>









<!-- CATEGORY -->


<div class="mb-3">


<label class="form-label">

Category

</label>



<select

class="form-select"

id="category">


<option>

Programming

</option>


<option>

Data Engineering

</option>


<option>

Mathematics

</option>


<option>

Science

</option>


<option>

Business

</option>


<option>

General Knowledge

</option>


</select>



</div>








<!-- DIFFICULTY -->


<div class="mb-3">


<label class="form-label">

Difficulty Level

</label>


<select

class="form-select"

id="difficulty">


<option value="easy">

Easy

</option>


<option value="medium">

Medium

</option>


<option value="hard">

Hard

</option>


</select>



</div>








<div class="row">



<div class="col-md-6">


<label class="form-label">

Number of Questions

</label>


<input

type="number"

class="form-control"

id="questions"

min="1"

placeholder="10"

required>



</div>







<div class="col-md-6">


<label class="form-label">

Time Limit (Minutes)

</label>


<input

type="number"

class="form-control"

id="duration"

min="1"

placeholder="20"

required>



</div>



</div>









<!-- IMAGE -->


<div class="mb-4 mt-3">


<label class="form-label">

Quiz Image URL

</label>


<input

type="url"

class="form-control"

id="image"

placeholder="https://image-url.com">


</div>









<button

type="submit"

class="btn btn-primary btn-lg w-100">


<i class="bi bi-cloud-upload"></i>

Publish Quiz


</button>






</form>








</div>


</div>


</div>


</div>


</section>









<footer class="bg-dark text-white py-4">


<div class="container text-center">


QuizVerse Admin


</div>


</footer>







<script src="js/admin_quiz.js"></script>


</body>

</html>
