<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Manage Quizzes | Admin</title>


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin.css">


</head>


<body>



<!-- NAVBAR -->


<nav class="navbar navbar-dark bg-dark">


<div class="container">


<a class="navbar-brand fw-bold"
href="admin.html">


<i class="bi bi-shield-lock-fill"></i>

QuizVerse Admin


</a>



<a href="admin.html"
class="btn btn-outline-light">

Dashboard

</a>


</div>


</nav>









<section class="admin-section">


<div class="container">





<div class="d-flex justify-content-between align-items-center mb-5">


<div>

<h1 class="fw-bold">

Manage Quizzes

</h1>


<p class="text-muted">

Create, update and control quizzes

</p>


</div>





<a href="admin_add_quiz.html"

class="btn btn-primary">


<i class="bi bi-plus-circle"></i>

Add Quiz


</a>


</div>









<!-- SEARCH -->


<div class="row mb-4">


<div class="col-md-8">


<div class="input-group">


<span class="input-group-text">

<i class="bi bi-search"></i>

</span>


<input

type="text"

id="searchQuiz"

class="form-control"

placeholder="Search quizzes...">


</div>


</div>






<div class="col-md-4">


<select

id="category"

class="form-select">


<option value="all">

All Categories

</option>


<option>

Programming

</option>


<option>

Data Engineering

</option>


<option>

Science

</option>


<option>

Mathematics

</option>


</select>


</div>


</div>









<!-- QUIZ TABLE -->


<div class="management-card shadow">



<table class="table table-hover">


<thead class="table-dark">


<tr>


<th>

Title

</th>


<th>

Category

</th>


<th>

Difficulty

</th>


<th>

Questions

</th>


<th>

Status

</th>


<th>

Actions

</th>



</tr>


</thead>





<tbody id="quizTable">






<tr class="quiz-row">


<td>

Python Fundamentals

</td>


<td>

Programming

</td>


<td>

<span class="badge bg-success">

Easy

</span>

</td>


<td>

15

</td>


<td>


<span class="badge bg-primary">

Active

</span>


</td>



<td>


<a href="admin_edit_quiz.html"

class="btn btn-warning btn-sm">


<i class="bi bi-pencil"></i>

</a>





<button

class="btn btn-danger btn-sm delete-btn">


<i class="bi bi-trash"></i>


</button>



</td>



</tr>








<tr class="quiz-row">


<td>

SQL Database Mastery

</td>


<td>

Data Engineering

</td>


<td>


<span class="badge bg-danger">

Hard

</span>


</td>


<td>

25

</td>


<td>


<span class="badge bg-primary">

Active

</span>


</td>


<td>



<a href="admin_edit_quiz.html"

class="btn btn-warning btn-sm">


<i class="bi bi-pencil"></i>


</a>



<button

class="btn btn-danger btn-sm delete-btn">


<i class="bi bi-trash"></i>


</button>



</td>



</tr>






</tbody>


</table>



</div>






</div>


</section>








<footer class="bg-dark text-white py-4">


<div class="container text-center">


QuizVerse Admin Panel


</div>


</footer>







<script src="js/admin_manage.js"></script>



</body>

</html>
