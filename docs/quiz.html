<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Python Basics | Quizeers</title>


<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Icons -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<!-- Google Font -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/quiz.css">


</head>


<body>



<!-- NAVBAR -->


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">


<div class="container">


<a class="navbar-brand fw-bold"
href="index.html">


<i class="bi bi-mortarboard-fill"></i>

Quizeers


</a>



</div>


</nav>








<!-- QUIZ HEADER -->


<section class="quiz-header">


<div class="container text-center">


<h1>

Python Fundamentals

</h1>


<p>

Test your Python knowledge

</p>


</div>


</section>








<!-- QUIZ AREA -->


<section class="container py-5">


<div class="quiz-box shadow">





<!-- Timer -->


<div class="quiz-top d-flex justify-content-between">


<div>

<i class="bi bi-list-check"></i>

Question

<span id="currentQuestion">

1

</span>

/ 

<span id="totalQuestions">

5

</span>


</div>





<div class="timer">


<i class="bi bi-stopwatch"></i>


<span id="time">

10:00

</span>


</div>



</div>








<!-- Progress -->


<div class="progress my-4">


<div

id="progressBar"

class="progress-bar"

style="width:20%">


20%


</div>


</div>








<!-- Question -->



<div id="questionContainer">



<h3 id="questionText">

What is Python?

</h3>





<div class="answers">





<div class="answer-option">


<input

type="radio"

name="answer"

value="A"

id="optionA">



<label for="optionA">

A. Programming Language

</label>



</div>







<div class="answer-option">


<input

type="radio"

name="answer"

value="B"

id="optionB">



<label for="optionB">

B. Database

</label>



</div>







<div class="answer-option">


<input

type="radio"

name="answer"

value="C"

id="optionC">



<label for="optionC">

C. Operating System

</label>



</div>







<div class="answer-option">


<input

type="radio"

name="answer"

value="D"

id="optionD">



<label for="optionD">

D. Browser

</label>



</div>






</div>



</div>








<!-- Buttons -->



<div class="quiz-buttons mt-5 d-flex justify-content-between">


<button

class="btn btn-outline-secondary"

id="previousBtn">


<i class="bi bi-arrow-left"></i>

Previous


</button>







<button

class="btn btn-primary"

id="nextBtn">


Next

<i class="bi bi-arrow-right"></i>


</button>




<button

class="btn btn-success d-none"

id="submitBtn">


<i class="bi bi-check-circle"></i>

Submit Quiz


</button>



</div>






</div>


</section>









<!-- FOOTER -->


<footer class="bg-dark text-white py-4">


<div class="container text-center">


<h5>

Quizeers

</h5>


<p>

Learn • Challenge • Achieve

</p>



</div>


</footer>






<script src="js/timer.js"></script>

<script src="js/quiz.js"></script>


<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>



</body>


</html>
