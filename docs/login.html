<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quizeers</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="demo-banner">Static front-end preview for GitHub Pages — no backend, nothing is saved.</div>

    <header class="site-header">
        <div class="container">
            <a class="logo" href="index.html">
                <span class="logo-mark" aria-hidden="true">Q</span>
                Quizeers
            </a>
            <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-navigation">Menu</button>
            <nav class="main-nav" id="primary-navigation" aria-label="Primary">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container">

            <div class="page-form-wrap">
                <form class="form-card" data-demo-form data-demo-message="Static demo — login isn't wired to a backend here." novalidate>
                    <h2>Welcome back</h2>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                    <p class="form-footer">Don't have an account? <a href="register.html">Register here</a></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="pages">
                <h2>Quizeers</h2>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </div>
            <p class="copy">&copy; <span id="current-year">2026</span> Quizeers. Test your knowledge, one quiz at a time.</p>
        </div>
    </footer>

    <script src="static/js/main.js"></script>
    <script src="static/js/demo.js"></script>
    <script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
</body>
</html>
