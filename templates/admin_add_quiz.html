{% extends "base.html" %}

{% block title %}Add Quiz - Admin Panel{% endblock %}

{% block content %}
    <h2>Add Quiz</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="title" class="form-label">Quiz Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Quiz Description</label>
            <textarea class="form-control" id="description" name="description"></textarea>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" placeholder="General">
        </div>
        <div class="mb-3">
            <label for="difficulty" class="form-label">Difficulty</label>
            <select class="form-control" id="difficulty" name="difficulty">
                {% for level in difficulties %}
                    <option value="{{ level }}" {% if level == 'Medium' %}selected{% endif %}>{{ level }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="time_limit_minutes" class="form-label">Time Limit (minutes, optional)</label>
            <input type="number" min="1" class="form-control" id="time_limit_minutes" name="time_limit_minutes">
        </div>
        <div class="mb-3">
            <label for="max_attempts" class="form-label">Max Attempts (optional, blank = unlimited)</label>
            <input type="number" min="1" class="form-control" id="max_attempts" name="max_attempts">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="shuffle_questions" name="shuffle_questions" checked>
            <label class="form-check-label" for="shuffle_questions">Shuffle question and answer order per attempt</label>
        </div>
        <button type="submit" class="btn btn-primary">Add Quiz</button>
    </form>
{% endblock %}
